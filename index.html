<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome | Alya</title>


    <style>

        body {
            margin: 0;

            height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #080808,
                    #160b20,
                    #2a0d32
                );

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            text-align: center;

            color: white;
        }


        .cover {

            background: #111111;

            padding: 70px;

            width: 600px;

            border-radius: 30px;

            border: 1px solid #8e3fa3;

            box-shadow:
                0 0 25px rgba(177, 55, 214, 0.4),
                0 0 60px rgba(255, 70, 160, 0.2);
        }


        h1 {

            color: #ff72b6;

            font-size: 48px;

            margin-bottom: 15px;
        }


        p {

            color: #c9b7d0;

            font-size: 18px;

            margin-bottom: 35px;
        }


        .button {

            display: inline-block;

            padding: 14px 32px;

            background:
                linear-gradient(
                    90deg,
                    #8b3fb5,
                    #e84f9d
                );

            color: white;

            text-decoration: none;

            border-radius: 30px;

            font-weight: bold;

            box-shadow:
                0 0 20px
                rgba(232, 79, 157, 0.4);
        }


        .button:hover {

            transform: translateY(-3px);

        }

    </style>

</head>


<body>


    <div class="cover">

        <h1>
            WELCOME TO<br>
            PROFILE ALYA
        </h1>


        <p>
            Welcome to my personal website
        </p>


        <a
            href="profile.html"
            class="button"
        >
            Enter Profile →
        </a>

    </div>


</body>

</html>
