<!DOCTYPE html>
<html>
<head>
    <title>Latar Belakang - Alya</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0610;
            color: white;
            text-align: center;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: auto;
            padding: 70px 20px;
        }

        h1 {
            color: #d88cff;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #d8c7df;
            margin-bottom: 45px;
        }

        .pilihan {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 320px;
            min-height: 60px;
            border-radius: 30px;
            background: linear-gradient(90deg, #8e44ad, #e056fd);
            color: white;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .button:hover {
            transform: scale(1.05);
        }

        .navigasi {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 55px;
        }

        .navigasi a {
            padding: 13px 30px;
            border-radius: 30px;
            background: linear-gradient(90deg, #8e44ad, #e056fd);
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .navigasi a:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>LATAR BELAKANG</h1>

        <p class="subtitle">
            Kenali lebih jauh tentang kehidupan saya
        </p>

            <a href="pendidikan.html" class="button">
                PENDIDIKAN
            </a>

            <a href="pertemanan.html" class="button">
                LINGKUP PERTEMANAN
            </a>

        </div>

        <div class="navigasi">

            <a href="profile.html">
                ← Back
            </a>

            <a href="closingan.html">Next 
		 →
            </a>

        </div>

    </div>

</body>
</html>
